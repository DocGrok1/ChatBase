<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06080c">
<title>ChatBase — DCGP.AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#06080c;--surface:#0c1018;--border:#1a2030;--text:#e8eaf0;--muted:#6b7a94;--cyan:#00e5c8;--gold:#ffd700}
html,body{height:100%;font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--text)}
body{display:flex;flex-direction:column}

.header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.logo{font-size:17px;font-weight:700;letter-spacing:0.06em}
.logo span{color:var(--cyan)}
.status{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:#333}
.dot.live{background:var(--cyan);box-shadow:0 0 6px var(--cyan)}

.chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:12px 16px;border-radius:12px;font-size:15px;line-height:1.5;word-wrap:break-word}
.msg.user{align-self:flex-end;background:#1a2540;border-bottom-right-radius:4px}
.msg.aura{align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg.aura .tag{font-size:10px;color:var(--cyan);letter-spacing:0.08em;margin-bottom:4px;display:block}
.msg.system{align-self:center;color:var(--muted);font-size:12px;background:none;padding:4px}

.input-row{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:10px;background:var(--bg)}
.input-row input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 16px;color:var(--text);font-size:15px;outline:none}
.input-row input:focus{border-color:var(--cyan)}
.input-row button{background:var(--cyan);color:#000;border:none;border-radius:8px;padding:12px 20px;font-weight:700;font-size:14px;cursor:pointer}
.input-row button:disabled{opacity:0.4;cursor:default}

.footer{padding:8px;text-align:center;font-size:10px;color:#2a3040;border-top:1px solid #111}
</style>
</head>
<body>

<div class="header">
  <div class="logo">Chat<span>Base</span></div>
  <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">connecting</span></div>
</div>

<div class="chat" id="chat"></div>

<div class="input-row">
  <input type="text" id="input" placeholder="Talk to AURA" autocomplete="off">
  <button id="send" disabled>Send</button>
</div>

<div class="footer">AURA Governed Intelligence — Claude powers, AURA governs — Joshua Lopez / DCGP.AI LLC — USPTO 19/555,951</div>

<script>
const SPINE = 'https://aura115.ai';
const BRAIN = 'https://cloud.aura115.ai';
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const dot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
let history = [];
let ready = false;

function addMsg(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  if (role === 'aura') d.innerHTML = '<span class="tag">AURA — GOVERNED INTELLIGENCE</span>' + esc(text);
  else d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

async function checkHealth() {
  try {
    const r = await fetch(SPINE + '/api/governance-health', {signal: AbortSignal.timeout(6000)});
    const d = await r.json();
    if (d.ok) {
      dot.className = 'dot live';
      statusText.textContent = 'AURA live · governed';
      ready = true;
      sendBtn.disabled = false;
      return;
    }
  } catch(_) {}
  try {
    const r2 = await fetch(BRAIN + '/health', {signal: AbortSignal.timeout(6000)});
    const d2 = await r2.json();
    if (d2.ok) {
      dot.className = 'dot live';
      statusText.textContent = 'Eagle-One live';
      ready = true;
      sendBtn.disabled = false;
      return;
    }
  } catch(_) {}
  dot.className = 'dot';
  statusText.textContent = 'reconnecting';
  setTimeout(checkHealth, 10000);
}

async function send() {
  const text = input.value.trim();
  if (!text || !ready) return;
  input.value = '';
  sendBtn.disabled = true;
  addMsg('user', text);
  history.push({role:'user', content:text});

  try {
    // Try aura-chat-live first — it has the Anthropic key
    const r = await fetch(SPINE + '/api/aura-chat-live', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({message: text, history: history.slice(-12), source:'chatbase'}),
      signal: AbortSignal.timeout(60000)
    });
    const d = await r.json();
    const reply = d.reply || d.response || d.error || 'No response';
    addMsg('aura', reply);
    history.push({role:'assistant', content: reply});

    // Show governance if present
    if (d.governance && d.governance.contactHamiltonian) {
      const ch = d.governance.contactHamiltonian;
      addMsg('system', (ch.admitted ? '✓ admitted' : '✗ rejected') + ' · drift ' + (ch.instantDrift||0).toFixed(3) + (ch.proved ? ' · proved' : ''));
    }
  } catch(e) {
    // Fallback to intake manifold
    try {
      const r2 = await fetch(SPINE + '/api/intake-manifold', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({type:'message', message: text, source:'chatbase'}),
        signal: AbortSignal.timeout(30000)
      });
      const d2 = await r2.json();
      if (d2.admitted) addMsg('aura', 'Admitted through Wardenclyffe. Fingerprint: ' + (d2.qhp?.wardenclyffe?.raw_fingerprint || '—'));
      else addMsg('system', 'Intake: ' + (d2.error || 'queued'));
    } catch(e2) {
      addMsg('system', 'Connection error: ' + e.message);
    }
  }
  sendBtn.disabled = false;
  input.focus();
}

input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
sendBtn.addEventListener('click', send);
checkHealth();
addMsg('system', 'ChatBase — AURA governed intelligence. Claude powers, AURA governs.');
</script>
</body>
</html>
