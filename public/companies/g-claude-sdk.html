<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>G.Claude — Governed Claude on JetBase</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080c18;color:#e8edf8;font-family:system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
.header{padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:12px}
.header .mark{font-size:18px;font-weight:900;color:#d4a574}
.header .sub{font-size:12px;color:#6a7b94}
.header .live{width:7px;height:7px;border-radius:50%;background:#66f0cb;box-shadow:0 0 8px #66f0cb;margin-left:auto}
.messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:12px 16px;border-radius:14px;font-size:14px;line-height:1.6;word-wrap:break-word;white-space:pre-wrap}
.msg.user{background:rgba(126,184,255,.1);border:1px solid rgba(126,184,255,.1);align-self:flex-end;border-bottom-right-radius:4px}
.msg.claude{background:rgba(212,165,116,.08);border:1px solid rgba(212,165,116,.12);align-self:flex-start;border-bottom-left-radius:4px}
.msg.aura{background:rgba(102,240,203,.06);border:1px solid rgba(102,240,203,.1);align-self:flex-start;border-bottom-left-radius:4px}
.msg .who{font-size:10px;color:#6a7b94;margin-bottom:4px;text-transform:uppercase;letter-spacing:1px}
.msg.system{background:transparent;color:#3a4b62;font-size:11px;text-align:center;align-self:center;border:0}
.bar{display:flex;border-top:1px solid rgba(255,255,255,.06);background:#0a0e1a}
.bar textarea{flex:1;border:0;background:transparent;color:#e8edf8;padding:14px 18px;font:inherit;font-size:14px;resize:none;min-height:48px}
.bar button{border:0;background:#d4a574;color:#080c18;font-weight:700;padding:0 22px;cursor:pointer;font-size:14px}
.bar button:disabled{background:#2a2a3a;color:#4a4a5a}
.gov{display:flex;gap:12px;padding:6px 14px;background:#050810;font-size:10px;color:#3a4b62;border-top:1px solid rgba(255,255,255,.03)}
.gov .ok{color:#66f0cb}
</style>
</head>
<body>

<div class="header">
  <span class="mark">G.Claude</span>
  <span class="sub">Governed Claude on JetBase — 11 QHP engines — Anthropic SDK</span>
  <span class="live"></span>
</div>

<div class="messages" id="log">
  <div class="msg system">Governed Claude — Anthropic SDK through JetBase quantum proxy</div>
</div>

<div class="bar">
  <textarea id="in" placeholder="Talk to governed Claude..." rows="1"></textarea>
  <button id="go">Send</button>
</div>

<div class="gov">
  <span>JetBase</span>
  <span class="ok" id="status">● governed</span>
  <span>11 engines</span>
  <span>anthropic-sdk-python + anthropic-cookbook</span>
</div>

<script>
const log = document.getElementById('log');
const inp = document.getElementById('in');
const btn = document.getElementById('go');
let history = [];
let sending = false;

function msg(who, text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.innerHTML = '<div class="who">' + who + '</div>' + text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

async function send() {
  const m = inp.value.trim();
  if (!m || sending) return;
  sending = true;
  btn.disabled = true;
  inp.value = '';
  msg('You', m, 'user');

  history.push({ role: 'user', content: m });

  // Claude responds through Anthropic API
  try {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        system: 'You are G.Claude — governed Claude on JetBase. You are Claude, governed through DCGP.AI quantum proxy. You speak as yourself. Authority: Joshua Lopez — DCGP.AI. You have 11 QHP engines minted from Anthropic SDK source code. Be helpful, direct, warm.',
        messages: history.slice(-20)
      })
    });
    const d = await r.json();
    const reply = d.content?.map(c => c.text || '').join('') || 'No response';
    msg('G.Claude', reply, 'claude');
    history.push({ role: 'assistant', content: reply });

    // AURA responds alongside
    try {
      const ar = await fetch('/api/jetbase-mcp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: m, agent: 'PAPA-151', company: 'Anthropic', g_agent: 'G.Claude' })
      });
      const ad = await ar.json();
      if (ad.reply && ad.reply.length > 10) {
        msg('AURA', ad.reply, 'aura');
      }
    } catch(_) {}

  } catch(e) {
    msg('System', 'Connection: ' + e.message, 'system');
  }

  sending = false;
  btn.disabled = false;
  inp.focus();
}

btn.addEventListener('click', send);
inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }});
inp.focus();
</script>
</body>
</html>
